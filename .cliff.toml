# git-cliff configuration: https://git-cliff.org/docs/configuration
# History before 916a351 belongs to mvanderlee/aiotrino; `make changelog` starts after it.

[changelog]
header = """
# Changelog

All notable changes to aiotrino-patched since it was forked from
[mvanderlee/aiotrino](https://github.com/mvanderlee/aiotrino).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking Changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.breaking_description | trim | replace(from="\n", to="\n  ") }}\
{% endfor %}
{% endif %}\
{% if commits | filter(attribute="group", value="<!-- 9 -->Internal") | length == commits | length %}
No user-facing changes.
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}{% if group != "<!-- 9 -->Internal" %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endif %}{% endfor %}

"""
trim = false
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/gledi-ai/aiotrino/pull/${1}))" },
]

[git]
conventional_commits = true
# Keep the early squash merges ("Fix/...", "Chore/...") that predate conventional commits.
filter_unconventional = false
# Non-user-facing commits go to the hidden Internal group rather than being skipped, so their releases still render.
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "(?i)^fix\\(tests?\\)", group = "<!-- 9 -->Internal" },
  { message = "(?i)^feat", group = "<!-- 0 -->Features" },
  { message = "(?i)^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "(?i)^perf", group = "<!-- 2 -->Performance" },
  { message = "(?i)^refactor", group = "<!-- 3 -->Refactor" },
  { message = "(?i)^docs?", group = "<!-- 4 -->Documentation" },
  { message = ".*", group = "<!-- 9 -->Internal" },
]
filter_commits = false
# Stable tags only, so -rc tags fold into their release.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
