name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags; need full history
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13,<0.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run linter
        run: uv run --locked ruff check aiotrino tests

      - name: Run formatter check
        run: uv run --locked ruff format --check aiotrino tests

  run-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        sqlalchemy: ["2.0", "2.1"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags; need full history
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13,<0.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run tests on SQLAlchemy ${{ matrix.sqlalchemy }}
        run: uvx --with nox-uv nox --session="test-${{ matrix.python-version }}(sqlalchemy='${{ matrix.sqlalchemy }}')" --non-interactive -- -n auto

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-py${{ matrix.python-version }}-sqlalchemy${{ matrix.sqlalchemy }}
          path: |
            junit-${{ matrix.python-version }}-sqlalchemy${{ matrix.sqlalchemy }}.xml
            coverage-${{ matrix.python-version }}-sqlalchemy${{ matrix.sqlalchemy }}.xml
          if-no-files-found: warn
